<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Maska wycinająca przezroczysty pasek na oczy w białej głowie -->
    <mask id="head-cutout">
      <!-- Biały kolor w masce oznacza elementy widoczne -->
      <rect x="0" y="0" width="32" height="32" fill="#FFFFFF" />
      <!-- Czarny kolor w masce wycina pełną przezroczystość (pasek oczu) -->
      <rect x="0" y="13" width="32" height="5" fill="#000000" />
    </mask>
  </defs>

  <!-- Końcówki opaski (węzeł z prawej strony) - kolor biały -->
  <path d="M 25.5 13 C 26.5 9.5, 29.5 8.5, 31 9 C 30.5 11.5, 29 13, 27 13.5 C 29.5 13.8, 31 15, 31.5 17 C 29 17.2, 26.8 16, 25.5 14.2 Z" fill="#FFFFFF" />

  <!-- Biała baza głowy (góra i dół) z wyciętym przezroczystym środkiem -->
  <circle cx="16" cy="16" r="11" fill="#FFFFFF" mask="url(#head-cutout)" />

  <!-- Lewe oko połączone w jedną bryłę z brwią - kolor biały -->
  <path d="M 8 13.5 L 13.8 15.6 L 12.3 15.3 A 1.15 1.15 0 1 1 9.9 14.8 L 8 14.4 Z" fill="#FFFFFF" />

  <!-- Prawe oko połączone w jedną bryłę z brwią - kolor biały -->
  <path d="M 24 13.5 L 18.2 15.6 L 19.7 15.3 A 1.15 1.15 0 1 0 22.1 14.8 L 24 14.4 Z" fill="#FFFFFF" />
</svg>
